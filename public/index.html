<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuMad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%9A%AC</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f3ef; min-height: 100vh; }
  html[data-bs-theme="dark"] body { background: #16181a; }
  .fumad-card { max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
  #heat-alert-overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: rgba(253, 126, 20, 0.35);
    display: none; z-index: 1000;
  }
  #heat-alert-overlay.active { display: block; }
  .btn-heat { background: #fd7e14; border: 1px solid #c0530a; color: #000; }
  .btn-heat:hover { background: #c0530a; color: #000; }
  .occupancy-bar { flex: 1; margin: 0 1px; background: #0d6efd; border-radius: 2px 2px 0 0; min-height: 2px; }
  html[data-bs-theme="dark"] .occupancy-bar { background: #4dabf7; }
  .occupancy-bar.occupancy-peak { background: #dc3545; }
  html[data-bs-theme="dark"] .occupancy-bar.occupancy-peak { background: #ff6b6b; }
  #rain-overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; display: none; }
  #rain-overlay.active { display: block; }
  .rain-drop {
    position: absolute;
    top: -10%;
    width: 2px;
    height: 24px;
    background: linear-gradient(to bottom, rgba(148,187,233,0), rgba(148,187,233,0.75));
    animation-name: rain-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rain-fall {
    to { top: 110%; }
  }
  .rail-bar { fill: #2b2b2b; }
  .rail-posts { stroke: #2b2b2b; }
  html[data-bs-theme="dark"] .rail-bar { fill: #f1f1f1; }
  html[data-bs-theme="dark"] .rail-posts { stroke: #f1f1f1; }
  .btn-book { background: #fff; border: 1px solid #444; color: #000; }
  .btn-book:hover { background: #e9ecef; color: #000; }
  .spot { cursor: pointer; }
  .spot-body { transition: fill .15s ease; }
  .spot-free .spot-body { fill: #ffffff; stroke: #adb5bd; }
  .spot-mine .spot-body { fill: #198754; stroke: #146c43; }
  .spot-taken .spot-body { fill: #dc3545; stroke: #b02a37; cursor: not-allowed; }
  .spot-privacy .spot-body { fill: #0dcaf0; stroke: #0aa2c0; }
  .spot-gossip .spot-body { fill: #d63384; stroke: #ab296a; }
  .spot-locked .spot-body { fill: #e9ecef; stroke: #adb5bd; cursor: not-allowed; }
  .spot-initial { font-size: 14px; font-weight: 600; fill: #495057; pointer-events: none; }
  .spot-mine .spot-initial, .spot-taken .spot-initial, .spot-privacy .spot-initial, .spot-gossip .spot-initial { fill: #fff; }
  .spot-timer { font-size: 10px; fill: #6c757d; pointer-events: none; }
  .queue-circle {
    width: 32px; height: 32px; border-radius: 50%; background: #0d6efd; color: #fff;
    font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .btn-privacy { background: #0dcaf0; border: 1px solid #0aa2c0; color: #000; }
  .btn-privacy:hover { background: #0aa2c0; color: #000; }
  .btn-gossip { background: #d63384; border: 1px solid #ab296a; color: #000; }
  .btn-gossip:hover { background: #ab296a; color: #000; }
  #error-box, #auth-error { display: none; }
  #board-view { display: none; }
  #gossip-panel { display: none; }
</style>
</head>
<body>
<div id="heat-alert-overlay"></div>
<div class="container py-5">

  <div class="card fumad-card shadow-sm border-0" id="auth-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">FuMad &#128684;</h1>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" id="tab-login" type="button">Accedi</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-register" type="button">Registrati</button></li>
      </ul>
      <div class="mb-3">
        <label class="form-label small text-secondary">Username</label>
        <input type="text" id="auth-username" class="form-control" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">Password</label>
        <input type="password" id="auth-password" class="form-control" autocomplete="current-password">
      </div>
      <div class="mb-3" id="auth-password-confirm-group" style="display:none;">
        <label class="form-label small text-secondary">Conferma password</label>
        <input type="password" id="auth-password-confirm" class="form-control" autocomplete="new-password">
      </div>
      <div class="mb-3" id="auth-invite-group" style="display:none;">
        <label class="form-label small text-secondary">Codice di invito</label>
        <input type="text" id="auth-invite" class="form-control" autocomplete="off">
      </div>
      <button id="auth-submit" class="btn btn-dark w-100">Accedi</button>
      <div id="auth-error" class="alert alert-danger small mt-3 mb-0" role="alert"></div>
    </div>
  </div>

  <div class="card fumad-card shadow-sm border-0" id="board-view">
    <div id="rain-overlay"></div>
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h1 class="h4 mb-0">FuMad &#128684;</h1>
          <div class="text-secondary small">Ciao, <span id="me-label"></span> &middot; <a href="#" id="logout-link">esci</a></div>
        </div>
        <div class="text-secondary small text-end">
          <button id="theme-toggle-btn" class="btn btn-sm btn-outline-secondary" type="button">🌙</button>
        </div>
      </div>

      <div class="d-flex gap-2 mb-3">
        <button id="balcony-1-btn" class="btn btn-sm btn-primary flex-fill">Balcone #1</button>
        <button id="balcony-2-btn" class="btn btn-sm btn-outline-primary flex-fill">Balcone #2</button>
      </div>

      <div class="d-flex justify-content-center align-items-center gap-1 mb-1 text-secondary small" id="weather-bar">
        <span id="weather-icon">&#9728;&#65039;</span>
        <span id="weather-temp"></span>
      </div>
      <div id="heat-alert-text" class="text-center small mb-2" style="display:none;">
        <span id="heat-alert-message"></span>
        <a href="#" id="heat-alert-dismiss">nascondi sfondo</a>
      </div>

      <svg id="balcony-svg" viewBox="0 0 400 170" style="width:100%;height:auto;">
        <g id="spots"></g>
        <rect x="0" y="60" width="400" height="10" class="rail-bar"/>
        <rect x="0" y="130" width="400" height="10" class="rail-bar"/>
        <g class="rail-posts" stroke-width="6">
          <line x1="14" y1="60" x2="14" y2="140"/><line x1="46" y1="60" x2="46" y2="140"/>
          <line x1="78" y1="60" x2="78" y2="140"/><line x1="110" y1="60" x2="110" y2="140"/>
          <line x1="142" y1="60" x2="142" y2="140"/><line x1="174" y1="60" x2="174" y2="140"/>
          <line x1="206" y1="60" x2="206" y2="140"/><line x1="238" y1="60" x2="238" y2="140"/>
          <line x1="270" y1="60" x2="270" y2="140"/><line x1="302" y1="60" x2="302" y2="140"/>
          <line x1="334" y1="60" x2="334" y2="140"/><line x1="366" y1="60" x2="366" y2="140"/>
        </g>
        <rect x="0" y="140" width="400" height="18" fill="#c9a876"/>
      </svg>

      <div class="d-grid gap-2 mb-2">
        <button id="book-btn" class="btn btn-book">Occupa un posto</button>
        <div class="d-flex gap-2">
          <button id="privacy-btn" class="btn btn-privacy flex-fill">Privacy (2 min)</button>
          <button id="gossip-btn" class="btn btn-gossip flex-fill">Gossip (5 min)</button>
        </div>
        <button id="queue-btn" class="btn btn-outline-primary">Mettiti in coda</button>
      </div>
      <div class="text-secondary small mb-2">Libera automaticamente ogni 15 min</div>
      <div id="queue-list" class="d-flex gap-2 mb-3"></div>

      <div id="gossip-panel" class="border rounded p-3 mb-3">
        <div class="small text-secondary mb-2" id="gossip-instructions">Seleziona con chi vuoi il Gossip:</div>
        <div id="gossip-user-list" class="d-flex flex-column gap-1 mb-3"></div>
        <div class="d-flex gap-2">
          <button id="gossip-confirm-btn" class="btn btn-sm btn-gossip">Avvia Gossip</button>
          <button id="gossip-cancel-btn" class="btn btn-sm btn-outline-secondary">Annulla</button>
        </div>
      </div>

      <div id="error-box" class="alert alert-danger small mb-3" role="alert"></div>

      <div class="d-flex justify-content-center">
        <button id="heat-alert-btn" class="btn btn-sm btn-heat">🔥 Allerta Caldo</button>
      </div>

      <div class="mt-4">
        <div class="text-secondary small text-center mb-1">Affollamento per fascia oraria</div>
        <div id="occupancy-chart" class="d-flex align-items-end justify-content-between" style="height:50px;"></div>
        <div class="d-flex justify-content-between text-secondary" style="font-size:9px;">
          <span>0</span><span>6</span><span>12</span><span>18</span><span>23</span>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
(function(){
  var SEAT_TTL_MS = 15 * 60 * 1000;
  var RESERVATION_TTL_MS = { privacy: 2 * 60 * 1000, gossip: 5 * 60 * 1000 };
  var NAPLES_LAT = 40.8518, NAPLES_LON = 14.2681;
  var RAIN_CODES = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99];
  var WEATHER_ICONS = {
    0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
    45: '🌫️', 48: '🌫️',
    51: '🌦️', 53: '🌦️', 55: '🌦️',
    56: '🌧️', 57: '🌧️',
    61: '🌧️', 63: '🌧️', 65: '🌧️',
    66: '🌧️', 67: '🌧️',
    71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️',
    80: '🌦️', 81: '🌧️', 82: '⛈️',
    85: '🌨️', 86: '🌨️',
    95: '⛈️', 96: '⛈️', 99: '⛈️'
  };
  var WEATHER_COMMENTS = {
    0: 'cielo sereno', 1: 'quasi sereno', 2: 'poco nuvoloso', 3: 'cielo coperto',
    45: 'nebbia in vista', 48: 'nebbia gelata',
    51: 'pioviggine leggera', 53: 'pioviggine', 55: 'pioviggine intensa',
    56: 'pioviggine gelata', 57: 'pioviggine gelata intensa',
    61: 'pioggia leggera', 63: 'pioggia', 65: 'pioggia forte',
    66: 'pioggia gelata', 67: 'pioggia gelata intensa',
    71: 'neve leggera', 73: 'neve', 75: 'neve forte', 77: 'granelli di neve',
    80: 'rovesci leggeri', 81: 'rovesci', 82: 'rovesci violenti',
    85: 'rovesci di neve', 86: 'rovesci di neve forti',
    95: 'temporale', 96: 'temporale con grandine', 99: 'temporale con grandine forte'
  };

  function weatherComment(code, temp){
    var base = WEATHER_COMMENTS[code] || 'meteo variabile';
    if (temp >= 35) return base + ', caldo torrido';
    if (temp >= 28) return base + ', giornata calda';
    if (temp <= 5) return base + ', freddo pungente';
    return base;
  }
  function seatPositions(count){
    var spacing = 400 / (count + 1);
    var arr = [];
    for (var i = 1; i <= count; i++){
      arr.push({ x: spacing * i, y: 20 });
    }
    return arr;
  }
  var mode = 'login';
  var me = null;
  var currentBalcony = 1;
  var lastBoard = null;

  var authCard = document.getElementById('auth-card');
  var boardView = document.getElementById('board-view');
  var authError = document.getElementById('auth-error');
  var errorBox = document.getElementById('error-box');
  var tooltip = document.createElement('div');
  tooltip.style.cssText = 'position:fixed;pointer-events:none;background:#212529;color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;display:none;z-index:1000;transform:translate(-50%,-130%);';
  document.body.appendChild(tooltip);

  function showTooltip(text, evt){ tooltip.textContent = text; tooltip.style.display = 'block'; moveTooltip(evt); }
  function moveTooltip(evt){ tooltip.style.left = evt.clientX + 'px'; tooltip.style.top = evt.clientY + 'px'; }
  function hideTooltip(){ tooltip.style.display = 'none'; }

  function showAuthError(msg){ authError.textContent = msg; authError.style.display = 'block'; }
  function clearAuthError(){ authError.style.display = 'none'; }
  function showError(msg){ errorBox.textContent = msg; errorBox.style.display = 'block'; }
  function clearError(){ errorBox.style.display = 'none'; }

  async function api(path, options){
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || 'Errore imprevisto.');
    return data;
  }

  var passwordConfirmGroup = document.getElementById('auth-password-confirm-group');
  var inviteGroup = document.getElementById('auth-invite-group');

  document.getElementById('tab-login').addEventListener('click', function(){
    mode = 'login';
    this.classList.add('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('auth-submit').textContent = 'Accedi';
    passwordConfirmGroup.style.display = 'none';
    document.getElementById('auth-password-confirm').value = '';
    inviteGroup.style.display = 'none';
    document.getElementById('auth-invite').value = '';
    clearAuthError();
  });
  document.getElementById('tab-register').addEventListener('click', function(){
    mode = 'register';
    this.classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('auth-submit').textContent = 'Crea account';
    passwordConfirmGroup.style.display = 'block';
    inviteGroup.style.display = 'block';
    clearAuthError();
  });

  document.getElementById('auth-submit').addEventListener('click', async function(){
    clearAuthError();
    var username = document.getElementById('auth-username').value.trim();
    var password = document.getElementById('auth-password').value;
    if (!username || !password){
      showAuthError('Inserisci username e password.');
      return;
    }
    var payload = { username: username, password: password };
    if (mode === 'register'){
      var passwordConfirm = document.getElementById('auth-password-confirm').value;
      if (password !== passwordConfirm){
        showAuthError('Le password non coincidono.');
        return;
      }
      payload.inviteCode = document.getElementById('auth-invite').value;
    }
    try {
      var data = await api('/api/' + mode, { method: 'POST', body: JSON.stringify(payload) });
      me = data.username;
      showBoard();
    } catch (e){
      showAuthError(e.message);
    }
  });

  document.getElementById('logout-link').addEventListener('click', async function(evt){
    evt.preventDefault();
    await api('/api/logout', { method: 'POST' });
    me = null;
    boardView.style.display = 'none';
    authCard.style.display = 'block';
  });

  function showBoard(){
    authCard.style.display = 'none';
    boardView.style.display = 'block';
    document.getElementById('me-label').textContent = me;
    loadState();
    if (!showBoard.polling){
      showBoard.polling = setInterval(loadState, 5000);
    }
    loadWeather();
    if (!showBoard.weatherPolling){
      showBoard.weatherPolling = setInterval(loadWeather, 30 * 60 * 1000);
    }
  }

  function renderOccupancyChart(history){
    var counts = new Array(24).fill(0);
    (history || []).forEach(function(entry){
      counts[new Date(entry.time).getHours()]++;
    });
    var peak = Math.max.apply(null, counts);
    var scale = Math.max(peak, 1);
    var chart = document.getElementById('occupancy-chart');
    chart.innerHTML = '';
    counts.forEach(function(count, hour){
      var bar = document.createElement('div');
      bar.className = 'occupancy-bar' + (peak > 0 && count === peak ? ' occupancy-peak' : '');
      bar.style.height = Math.max(2, (count / scale) * 100) + '%';
      bar.title = hour + ':00 - ' + count + (count === 1 ? ' prenotazione' : ' prenotazioni');
      chart.appendChild(bar);
    });
  }

  var dismissedHeatAlertSince = null;

  function applyHeatAlert(heatAlert){
    var overlay = document.getElementById('heat-alert-overlay');
    var text = document.getElementById('heat-alert-text');
    var message = document.getElementById('heat-alert-message');
    if (heatAlert && heatAlert.active){
      message.textContent = heatAlert.by + ' ha attivato allarme caldo';
      text.style.display = 'block';
      overlay.classList.toggle('active', heatAlert.since !== dismissedHeatAlertSince);
    } else {
      overlay.classList.remove('active');
      text.style.display = 'none';
      dismissedHeatAlertSince = null;
    }
  }

  document.getElementById('heat-alert-dismiss').addEventListener('click', function(evt){
    evt.preventDefault();
    if (lastBoard && lastBoard.heatAlert){
      dismissedHeatAlertSince = lastBoard.heatAlert.since;
    }
    document.getElementById('heat-alert-overlay').classList.remove('active');
  });

  var THEME_KEY = 'fumad-theme';
  function applyTheme(theme){
    document.documentElement.setAttribute('data-bs-theme', theme);
    document.getElementById('theme-toggle-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(THEME_KEY, theme);
  }
  document.getElementById('theme-toggle-btn').addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-bs-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

  document.getElementById('heat-alert-btn').addEventListener('click', async function(){
    clearError();
    try {
      var data = await api('/api/heat-alert', { method: 'POST' });
      applyHeatAlert(data.heatAlert);
    } catch(e){ showError(e.message); }
  });

  function ensureRainDrops(){
    var overlay = document.getElementById('rain-overlay');
    if (overlay.childElementCount > 0) return;
    for (var i = 0; i < 40; i++){
      var drop = document.createElement('div');
      drop.className = 'rain-drop';
      drop.style.left = (Math.random() * 100) + '%';
      drop.style.animationDuration = (0.4 + Math.random() * 0.5) + 's';
      drop.style.animationDelay = (Math.random() * 2) + 's';
      overlay.appendChild(drop);
    }
  }

  async function loadWeather(){
    try {
      var res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + NAPLES_LAT + '&longitude=' + NAPLES_LON + '&current_weather=true');
      var data = await res.json();
      var code = data.current_weather.weathercode;
      var temp = Math.round(data.current_weather.temperature);
      document.getElementById('weather-icon').textContent = WEATHER_ICONS[code] || '🌡️';
      document.getElementById('weather-temp').textContent = temp + '°C, ' + weatherComment(code, temp);
      if (RAIN_CODES.indexOf(code) !== -1){
        ensureRainDrops();
        document.getElementById('rain-overlay').classList.add('active');
      } else {
        document.getElementById('rain-overlay').classList.remove('active');
      }
    } catch (e) {
      // meteo decorativo, se fallisce non blocca il resto della board
    }
  }

  function standingFront(cx, cy, initial, timeLabel){
    var circle = '<circle class="spot-body" cx="'+cx+'" cy="'+cy+'" r="18" stroke-width="1.5"/>';
    var text = initial ? '<text class="spot-initial" x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central">'+initial+'</text>' : '';
    var timer = timeLabel ? '<text class="spot-timer" x="'+cx+'" y="'+(cy+32)+'" text-anchor="middle">'+timeLabel+'</text>' : '';
    return circle + text + timer;
  }

  function seatTtlFor(reservation){
    if (!reservation) return SEAT_TTL_MS;
    return RESERVATION_TTL_MS[reservation.type] || SEAT_TTL_MS;
  }

  function remainingLabel(seatSince, ttlMs){
    if (!seatSince) return '';
    var elapsed = Date.now() - new Date(seatSince).getTime();
    var minutes = Math.max(0, Math.ceil(((ttlMs || SEAT_TTL_MS) - elapsed) / 60000));
    return minutes + 'm';
  }

  function renderBoard(board){
    lastBoard = board;
    var spotsGroup = document.getElementById('spots');
    spotsGroup.innerHTML = '';
    var reservation = board.reservation;
    var positions = seatPositions(board.seats.length);
    board.seats.forEach(function(occupant, i){
      var pos = positions[i];
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      var cls = 'spot-free';
      var timeLabel = '';
      var initial = '';
      var tooltipText = 'libero';
      if (occupant === true){
        cls = 'spot-locked';
        initial = '🔒';
        tooltipText = 'posto bloccato';
      } else if (occupant){
        timeLabel = remainingLabel(board.seatSince && board.seatSince[i], seatTtlFor(reservation));
        initial = occupant.charAt(0).toUpperCase();
        tooltipText = timeLabel ? occupant + ' · libero tra ' + timeLabel : occupant;
        if (reservation && reservation.type === 'privacy'){
          cls = 'spot-privacy';
        } else if (reservation && reservation.type === 'gossip'){
          cls = 'spot-gossip';
          initial = '';
          tooltipText = '';
        } else {
          cls = occupant === me ? 'spot-mine' : 'spot-taken';
        }
      }
      g.setAttribute('class', 'spot ' + cls);
      g.innerHTML = standingFront(pos.x, pos.y, initial, timeLabel);
      if (tooltipText){
        g.addEventListener('mouseenter', function(evt){ showTooltip(tooltipText, evt); });
        g.addEventListener('mousemove', moveTooltip);
        g.addEventListener('mouseleave', hideTooltip);
      }
      g.addEventListener('click', async function(){
        clearError();
        if (occupant !== me) return;
        try {
          var data = await api('/api/free', { method: 'POST', body: JSON.stringify({ balcony: currentBalcony }) });
          renderBoard(data);
        } catch(e){ showError(e.message); }
      });
      spotsGroup.appendChild(g);
    });
    document.getElementById('book-btn').textContent = board.seats.indexOf(me) !== -1 ? 'Libera posto' : 'Occupa un posto';
    applyHeatAlert(board.heatAlert);
    renderOccupancyChart(board.history);

    var queueList = document.getElementById('queue-list');
    queueList.innerHTML = '';
    board.queue.forEach(function(name){
      var circle = document.createElement('div');
      circle.className = 'queue-circle';
      circle.textContent = name.charAt(0).toUpperCase();
      circle.addEventListener('mouseenter', function(evt){ showTooltip(name, evt); });
      circle.addEventListener('mousemove', moveTooltip);
      circle.addEventListener('mouseleave', hideTooltip);
      queueList.appendChild(circle);
    });
  }

  async function loadState(){
    try {
      var data = await api('/api/state?balcony=' + currentBalcony);
      renderBoard(data);
    } catch(e){
      if (e.message === 'Non autenticato.'){
        clearInterval(showBoard.polling);
        showBoard.polling = null;
        boardView.style.display = 'none';
        authCard.style.display = 'block';
      }
    }
  }

  function switchBalcony(id){
    currentBalcony = id;
    document.getElementById('balcony-1-btn').className = 'btn btn-sm flex-fill ' + (id === 1 ? 'btn-primary' : 'btn-outline-primary');
    document.getElementById('balcony-2-btn').className = 'btn btn-sm flex-fill ' + (id === 2 ? 'btn-primary' : 'btn-outline-primary');
    document.getElementById('gossip-panel').style.display = 'none';
    clearError();
    loadState();
  }

  document.getElementById('balcony-1-btn').addEventListener('click', function(){ switchBalcony(1); });
  document.getElementById('balcony-2-btn').addEventListener('click', function(){ switchBalcony(2); });

  async function queueFallback(){
    try {
      var data = await api('/api/queue', { method: 'POST', body: JSON.stringify({ balcony: currentBalcony }) });
      renderBoard(data);
    } catch(e){ showError(e.message); }
  }

  document.getElementById('book-btn').addEventListener('click', async function(){
    clearError();
    var haveSeat = lastBoard && lastBoard.seats.indexOf(me) !== -1;
    var endpoint = haveSeat ? '/api/free' : '/api/book';
    try {
      var data = await api(endpoint, { method: 'POST', body: JSON.stringify({ balcony: currentBalcony }) });
      renderBoard(data);
    } catch(e){ showError(e.message); }
  });

  document.getElementById('queue-btn').addEventListener('click', async function(){
    clearError();
    var balconyFull = currentBalcony === 1 && lastBoard && lastBoard.seats.every(function(s){ return s; });
    if (balconyFull){
      var tryOther = confirm('Il Balcone #1 e pieno. Vuoi provare a occupare un posto nel Balcone #2?');
      if (tryOther){
        try {
          var data2 = await api('/api/book', { method: 'POST', body: JSON.stringify({ balcony: 2 }) });
          switchBalcony(2);
          renderBoard(data2);
          return;
        } catch(e){
          // balcone 2 pieno anche: si prosegue con la coda sul balcone 1 qui sotto
        }
      }
    }
    try {
      var data = await api('/api/queue', { method: 'POST', body: JSON.stringify({ balcony: currentBalcony }) });
      renderBoard(data);
    } catch(e){ showError(e.message); }
  });

  document.getElementById('privacy-btn').addEventListener('click', async function(){
    clearError();
    document.getElementById('gossip-panel').style.display = 'none';
    try {
      var data = await api('/api/privacy', { method: 'POST', body: JSON.stringify({ balcony: currentBalcony }) });
      renderBoard(data);
      return;
    } catch(e){
      if (currentBalcony === 1){
        var tryOther = confirm('Il Balcone #1 non e libero per Privacy. Vuoi provare ad attivarla nel Balcone #2?');
        if (tryOther){
          try {
            var data2 = await api('/api/privacy', { method: 'POST', body: JSON.stringify({ balcony: 2 }) });
            switchBalcony(2);
            renderBoard(data2);
            return;
          } catch(e2){
            // balcone 2 non disponibile: si prosegue con la coda sul balcone 1 qui sotto
          }
        }
      }
      await queueFallback();
    }
  });

  document.getElementById('gossip-btn').addEventListener('click', async function(){
    clearError();
    try {
      var data = await api('/api/users');
      var maxInvite = (lastBoard ? lastBoard.seats.length : 4) - 1;
      document.getElementById('gossip-instructions').textContent = 'Seleziona con chi vuoi il Gossip (max ' + maxInvite + '):';
      var list = document.getElementById('gossip-user-list');
      list.innerHTML = '';
      if (data.users.length === 0){
        var empty = document.createElement('div');
        empty.className = 'text-secondary small';
        empty.textContent = 'Nessun altro utente registrato.';
        list.appendChild(empty);
      } else {
        data.users.forEach(function(u){
          var label = document.createElement('label');
          label.className = 'form-check';
          var input = document.createElement('input');
          input.type = 'checkbox';
          input.className = 'form-check-input me-2';
          input.value = u;
          label.appendChild(input);
          label.appendChild(document.createTextNode(u));
          list.appendChild(label);
        });
      }
      document.getElementById('gossip-panel').style.display = 'block';
    } catch(e){ showError(e.message); }
  });

  document.getElementById('gossip-cancel-btn').addEventListener('click', function(){
    document.getElementById('gossip-panel').style.display = 'none';
  });

  document.getElementById('gossip-confirm-btn').addEventListener('click', async function(){
    clearError();
    var checked = Array.prototype.slice.call(document.querySelectorAll('#gossip-user-list input:checked')).map(function(el){ return el.value; });
    var maxInvite = (lastBoard ? lastBoard.seats.length : 4) - 1;
    if (checked.length === 0){
      showError('Seleziona almeno un utente da invitare.');
      return;
    }
    if (checked.length > maxInvite){
      showError('Massimo ' + maxInvite + ' utenti oltre a te.');
      return;
    }
    var groupSize = checked.length + 1;
    try {
      var data = await api('/api/gossip', { method: 'POST', body: JSON.stringify({ members: checked, balcony: currentBalcony }) });
      document.getElementById('gossip-panel').style.display = 'none';
      renderBoard(data);
      return;
    } catch(e){
      if (currentBalcony === 1 && groupSize === 2){
        var tryOther = confirm('Il Balcone #1 non e libero per Gossip. Vuoi provare ad attivarlo nel Balcone #2?');
        if (tryOther){
          try {
            var data2 = await api('/api/gossip', { method: 'POST', body: JSON.stringify({ members: checked, balcony: 2 }) });
            document.getElementById('gossip-panel').style.display = 'none';
            switchBalcony(2);
            renderBoard(data2);
            return;
          } catch(e2){
            // balcone 2 non disponibile: si prosegue con la coda sul balcone 1 qui sotto
          }
        }
      }
      document.getElementById('gossip-panel').style.display = 'none';
      await queueFallback();
    }
  });

  // check if already logged in (existing session cookie)
  api('/api/me').then(function(data){
    me = data.username;
    showBoard();
  }).catch(function(){ /* not logged in, stay on auth screen */ });
})();
</script>
</body>
</html>
